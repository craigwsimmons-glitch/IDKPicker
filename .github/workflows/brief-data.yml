name: Morning brief data

# Checks the sites and collects stats each morning before Craig's 5:09am CT brief,
# then saves them, encrypted, to the `brief-data` branch (brief-data/latest.json.enc) for the brief to read.
on:
  schedule:
    - cron: '17 8 * * *'   # 08:17 UTC = 3:17am CDT / 2:17am CST
    - cron: '47 9 * * *'   # backup run in case the first is delayed or fails
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect
        env:
          IDKPICKER_STATS_KEY: ${{ secrets.IDKPICKER_STATS_KEY }}
        run: node .github/scripts/brief-data.mjs
      - name: Save to brief-data branch (encrypted)
        env:
          IDKPICKER_STATS_KEY: ${{ secrets.IDKPICKER_STATS_KEY }}
        run: |
          # The repo is public, so the file is encrypted with the stats key before it's committed.
          test -n "$IDKPICKER_STATS_KEY" || { echo "IDKPICKER_STATS_KEY secret is not set"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:IDKPICKER_STATS_KEY \
            -in brief-data/latest.json -out "$RUNNER_TEMP/latest.json.enc"
          rm -rf brief-data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # A fresh single-commit branch every run, so no history of past results is kept.
          git checkout --orphan brief-data-new
          git rm -rf --cached . >/dev/null
          git clean -fdx -q
          mkdir -p brief-data
          cp "$RUNNER_TEMP/latest.json.enc" brief-data/latest.json.enc
          git add brief-data/latest.json.enc
          # [skip ci] keeps Cloudflare Pages from building this branch
          git commit -q -m "Brief data $(date -u +%F) [skip ci]"
          git push --force origin brief-data-new:brief-data
